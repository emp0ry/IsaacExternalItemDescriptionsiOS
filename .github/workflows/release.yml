name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - name: Checkout iOS port
        uses: actions/checkout@v5

      - name: Checkout attributed EID resources
        uses: actions/checkout@v5
        with:
          repository: wofsauge/External-Item-Descriptions
          ref: 8b59d00c6828e333294639ad2b2b6875eae821cb
          path: upstream-eid

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
          command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ { print $2 }' package/control)"
          test -n "$version"
          python3 tools/release-notes.py "$version" > "$RUNNER_TEMP/release-body.md"
          python3 - "$version" <<'PY'
          import plistlib, sys
          from pathlib import Path
          version = sys.argv[1]
          info = plistlib.loads(Path('livecontainer/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] == version, 'Framework version mismatch'
          PY
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}" || {
              echo "Tag $GITHUB_REF_NAME does not match package version v${version}" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify every distribution
        shell: bash
        run: |
          set -euo pipefail
          make release \
            EID_SOURCE="$GITHUB_WORKSPACE/upstream-eid" \
            EXTRA_CFLAGS='-Wall -Wextra -Werror'

      - name: Verify release contents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            dist/IsaacExternalItemDescriptions.dylib
            dist/IsaacExternalItemDescriptions-PlayCover.dylib
            dist/IsaacExternalItemDescriptions-rootless.deb
            dist/IsaacExternalItemDescriptions-LiveContainer.framework.zip
            dist/IsaacExternalItemDescriptions-Embedded.zip
            dist/descriptions.json
            dist/SHA256SUMS
          )
          for file in "${required[@]}"; do test -s "$file"; done
          codesign --verify --strict dist/IsaacExternalItemDescriptions.dylib
          codesign --verify --strict dist/IsaacExternalItemDescriptions-PlayCover.dylib
          xcrun vtool -show-build dist/IsaacExternalItemDescriptions-PlayCover.dylib | grep -q 'platform MACCATALYST'
          test "$(lipo -archs dist/IsaacExternalItemDescriptions.dylib)" = arm64
          if otool -L dist/IsaacExternalItemDescriptions.dylib | grep -Eiq 'substrate|ellekit|libhooker|/var/jb'; then
            echo 'Jailbreak-only dependency detected' >&2
            exit 1
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS)
          test -s build/IsaacEID.bundle/eid_inline_icons.png
          test -s build/IsaacEID.bundle/eid_transform_icons.png
          test -s build/IsaacEID.bundle/eid_cardspills.png
          test -s build/IsaacEID.bundle/eid_player_icons.png
          test -s build/IsaacEID.bundle/original-renderer.json
          test -s build/IsaacEID.bundle/fonts/eid_default.fnt
          test -s build/IsaacEID.bundle/fonts/eid_default_0.png
          test -s build/IsaacEID.bundle/THIRD_PARTY_NOTICES.md
          unzip -l dist/IsaacExternalItemDescriptions-Embedded.zip > "$RUNNER_TEMP/embedded-files.txt"
          unzip -l dist/IsaacExternalItemDescriptions-LiveContainer.framework.zip > "$RUNNER_TEMP/livecontainer-files.txt"
          grep -q 'IsaacEID.bundle/eid_transform_icons.png' "$RUNNER_TEMP/embedded-files.txt"
          grep -q 'Resources/IsaacEID.bundle/descriptions.json' "$RUNNER_TEMP/livecontainer-files.txt"
          grep -q 'IsaacEID.bundle/fonts/eid_default.fnt' "$RUNNER_TEMP/embedded-files.txt"
          grep -q 'Resources/IsaacEID.bundle/original-renderer.json' "$RUNNER_TEMP/livecontainer-files.txt"

      - name: Create complete archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf full-build IsaacExternalItemDescriptions-Full-Build.zip
          mkdir -p full-build
          cp -R dist/. full-build/
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md full-build/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            full-build IsaacExternalItemDescriptions-Full-Build.zip

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: IsaacExternalItemDescriptions-v${{ steps.version.outputs.version }}
          path: |
            dist/IsaacExternalItemDescriptions.dylib
            dist/IsaacExternalItemDescriptions-PlayCover.dylib
            dist/IsaacExternalItemDescriptions-rootless.deb
            dist/IsaacExternalItemDescriptions-LiveContainer.framework.zip
            dist/IsaacExternalItemDescriptions-Embedded.zip
            dist/descriptions.json
            dist/SHA256SUMS
            IsaacExternalItemDescriptions-Full-Build.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Isaac External Item Descriptions iOS v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --latest \
            dist/IsaacExternalItemDescriptions.dylib \
            dist/IsaacExternalItemDescriptions-PlayCover.dylib \
            dist/IsaacExternalItemDescriptions-rootless.deb \
            dist/IsaacExternalItemDescriptions-LiveContainer.framework.zip \
            dist/IsaacExternalItemDescriptions-Embedded.zip \
            dist/descriptions.json \
            dist/SHA256SUMS \
            IsaacExternalItemDescriptions-Full-Build.zip
